[package]
name = "blossom-launcher-core"
version = "0.2.9"
edition = "2021"
[dependencies]
base64 = "0.22"
png = "0.17"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream", "multipart"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
java-properties = "2"
tempfile = "3"
regex = "1"
fs2 = "0.4"
