name: Build standalone FreeLook 1.8.9
on:
  push:
    branches: [ci/standalone-freelook-build]
    paths:
      - '.github/workflows/standalone-freelook.yml'
      - 'freelook/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.9'
      - name: Unpack standalone mod source
        run: |
          mkdir -p freelook/work
          base64 -d freelook/source.tar.gz.b64 | tar -xz -C freelook/work
          sed -i 's/\.turn(/.setAngles(/g' freelook/work/src/main/java/dev/jade/freelook/client/FreeLookHooks.java freelook/work/src/main/java/dev/jade/freelook/client/FreeLookRuntime.java
          sed -i 's/runtime\.setAngles(/runtime.turn(/g' freelook/work/src/main/java/dev/jade/freelook/client/FreeLookHooks.java
          sed -i 's/"turn".equals(name)/"turn".equals(name) || "setAngles".equals(name)/g' freelook/work/src/main/java/dev/jade/freelook/core/FreeLookTransformer.java
          # Preserve the original EntityRenderer mouse call so Lunar's Mixin can redirect it.
          # Intercept the underlying Entity.setAngles instead, before it changes player angles.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('freelook/work/src/main/java/dev/jade/freelook/core/FreeLookTransformer.java')
          s=p.read_text()
          s=s.replace('private static final String TARGET = "net.minecraft.client.renderer.EntityRenderer";',
                      'private static final String TARGET = "net.minecraft.client.renderer.EntityRenderer";\n    private static final String PLAYER_TARGET = "net.minecraft.entity.Entity";')
          s=s.replace('if (basicClass == null || !TARGET.equals(transformedName)) return basicClass;',
                      'if (basicClass == null) return basicClass;\n        if (PLAYER_TARGET.equals(transformedName)) return patchEntity(basicClass);\n        if (!TARGET.equals(transformedName)) return basicClass;')
          start=s.index('                            if (frame && opcode == Opcodes.INVOKEVIRTUAL')
          end=s.index('                            super.visitMethodInsn(opcode, owner, called, descriptor, isInterface);',start)
          s=s[:start]+s[end:]
          s=s.replace('if (mouseCalls[0] != 1 || angles[0] < 4)', 'if (angles[0] < 4)')
          s=s.replace('Installed mouse and camera hooks:', 'Installed camera hooks:')
          at=s.rfind('\n}')
          extra="""
    private static byte[] patchEntity(byte[] bytes) {
        try {
            ClassReader reader = new ClassReader(bytes);
            ClassWriter writer = new ClassWriter(reader, ClassWriter.COMPUTE_MAXS);
            final int[] patched = {0};
            reader.accept(new ClassVisitor(Opcodes.ASM5, writer) {
                @Override public MethodVisitor visitMethod(int access, String name, String desc,
                        String signature, String[] exceptions) {
                    MethodVisitor out = super.visitMethod(access, name, desc, signature, exceptions);
                    if (!desc.equals("(FF)V") ||
                        !(name.equals("func_70082_c") || name.equals("setAngles") ||
                          name.equals("turn") || name.equals("c"))) return out;
                    patched[0]++;
                    return new MethodVisitor(Opcodes.ASM5, out) {
                        @Override public void visitCode() {
                            super.visitCode();
                            org.objectweb.asm.Label proceed = new org.objectweb.asm.Label();
                            super.visitVarInsn(Opcodes.ALOAD, 0);
                            super.visitVarInsn(Opcodes.FLOAD, 1);
                            super.visitVarInsn(Opcodes.FLOAD, 2);
                            super.visitMethodInsn(Opcodes.INVOKESTATIC, HOOK, "interceptTurn",
                                    "(Lnet/minecraft/entity/Entity;FF)Z", false);
                            super.visitJumpInsn(Opcodes.IFEQ, proceed);
                            super.visitInsn(Opcodes.RETURN);
                            super.visitLabel(proceed);
                        }
                    };
                }
            }, 0);
            if (patched[0] != 1) {
                System.err.println("[StandaloneFreeLook] Entity mouse handler not found: " + patched[0]);
                return bytes;
            }
            System.out.println("[StandaloneFreeLook] Installed player mouse interception");
            return writer.toByteArray();
        } catch (Throwable ex) {
            ex.printStackTrace();
            return bytes;
        }
    }
"""
          s=s[:at]+extra+s[at:]
          p.write_text(s)
          p=Path('freelook/work/src/main/java/dev/jade/freelook/client/FreeLookHooks.java')
          s=p.read_text()
          marker='    private static boolean usable() {'
          inject="""    public static boolean interceptTurn(Entity entity, float x, float y) {
        FreeLookRuntime runtime = FreeLookRuntime.get();
        if (runtime == null || !runtime.isActive() || !(entity instanceof EntityPlayerSP)
                || Minecraft.getMinecraft().thePlayer != entity) return false;
        runtime.turn((EntityPlayerSP) entity, x, y);
        return true;
    }
"""
          s=s.replace(marker,inject+marker)
          p.write_text(s)
          PY
          ls -la freelook/work
      - name: Set up Forge 1.8.9 workspace
        working-directory: freelook/work
        run: gradle --no-daemon setupDecompWorkspace
      - name: Build FreeLook
        working-directory: freelook/work
        run: gradle --no-daemon build
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneFreeLook-Forge-1.8.9
          path: freelook/work/build/libs/*.jar
          if-no-files-found: error
