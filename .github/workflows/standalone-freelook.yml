name: Build standalone FreeLook 1.8.9
on:
  push:
    branches: [ci/standalone-freelook-build]
    paths:
      - '.github/workflows/standalone-freelook.yml'
      - 'freelook/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.9'
      - name: Unpack standalone mod source
        run: |
          mkdir -p freelook/work
          base64 -d freelook/source.tar.gz.b64 | tar -xz -C freelook/work
          ls -la freelook/work
      - name: Set up Forge 1.8.9 workspace
        working-directory: freelook/work
        run: gradle --no-daemon setupDecompWorkspace
      - name: Build FreeLook
        working-directory: freelook/work
        run: gradle --no-daemon build
      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneFreeLook-Forge-1.8.9
          path: freelook/work/build/libs/*.jar
          if-no-files-found: error
