name: Publish existing 0.2.9.1 packages
on: create
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.ref_type == 'branch' && github.event.ref == 'publish-0.2.9.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e48a6c1314d8d3f8cc808121b900b96513b2f65
      - name: Verify source builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: doomnub/blossom-client
        run: |
          for run in 40638684146 40638684076; do
            test "$(gh api repos/doomnub/blossom-client/actions/runs/$run --jq .head_sha)" = "5e48a6c1314d8d3f8cc808121b900b96513b2f65"
            test "$(gh api repos/doomnub/blossom-client/actions/runs/$run --jq .conclusion)" = success
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40638684076
          github-token: ${{ github.token }}
          pattern: blossom-native-*
          path: build/native-artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: 40638684146
          github-token: ${{ github.token }}
          name: blossom-client-ubuntu-latest
          path: build/libs
      - name: Assemble packages
        run: |
          python scripts/package_release.py
          python scripts/assemble_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.9.1 build/release/* --target 5e48a6c1314d8d3f8cc808121b900b96513b2f65 --prerelease --title "Blossom v0.2.9.1" --notes-file docs/releases/v0.2.9.1.md
