name: Publish alpha release
on:
  create:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blossom-release
  cancel-in-progress: false
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/'))
    uses: ./.github/workflows/native-launcher.yml
  release:
    needs: native
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/test_runtime.py
      - run: python scripts/package_release.py
      - uses: actions/download-artifact@v4
        with:
          pattern: blossom-native-*
          path: build/native-artifacts
      - name: Assemble native and legacy packages
        run: python scripts/assemble_release.py
      - name: Publish prerelease with tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="v$(cat VERSION)"
          test -f "docs/releases/$version.md"
          if [[ "$GITHUB_REF_NAME" == release/0.3.1-styles* && "$version" == "v0.3.1" ]]; then
            # Explicitly requested replacement of the earlier 0.3.1 prerelease.
            old=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" --jq .object.sha)
            [[ "$old" == "5253c10e0eb63fcc34e7d694c58a94d41afe90b3" || "$old" == "$GITHUB_SHA" ]]
            gh release edit "$version" --draft=true
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$version" -f sha="$GITHUB_SHA" -F force=false
            gh release upload "$version" build/release/* --clobber
            gh release edit "$version" --draft=false --prerelease --title "Blossom $version" --notes-file "docs/releases/$version.md"
          else
            gh release create "$version" build/release/* --target "$GITHUB_SHA" --prerelease --title "Blossom $version" --notes-file "docs/releases/$version.md"
          fi
