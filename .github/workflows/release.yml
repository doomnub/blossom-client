name: Publish existing 0.2.8 packages
on: create
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.ref_type == 'branch' && github.event.ref == 'publish-0.2.8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a64ddcc8bfa4a92b10b253420aa010d108713d4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40393484145
          github-token: ${{ github.token }}
          pattern: blossom-native-*
          path: build/native-artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: 40393484137
          github-token: ${{ github.token }}
          name: blossom-client-ubuntu-latest
          path: build/libs
      - name: Assemble existing packages
        run: |
          python scripts/package_release.py
          python scripts/assemble_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.8 build/release/* --target 3a64ddcc8bfa4a92b10b253420aa010d108713d4 --prerelease --title "Blossom v0.2.8" --notes-file docs/releases/v0.2.8.md
