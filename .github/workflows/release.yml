name: Publish existing 0.2.9 packages
on: create
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.ref_type == 'branch' && github.event.ref == 'publish-0.2.9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e912acf76e86f65ed32b94a24a7ca824cfb8cc49
      - name: Wait for source builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: doomnub/blossom-client
        run: |
          for run in 40485049263 40485049316; do
            test "$(gh api repos/doomnub/blossom-client/actions/runs/$run --jq .head_sha)" = "e912acf76e86f65ed32b94a24a7ca824cfb8cc49"
            gh run watch "$run" --exit-status --interval 30
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40485049316
          github-token: ${{ github.token }}
          pattern: blossom-native-*
          path: build/native-artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: 40485049263
          github-token: ${{ github.token }}
          name: blossom-client-ubuntu-latest
          path: build/libs
      - name: Assemble existing packages
        run: |
          python scripts/package_release.py
          python scripts/assemble_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.9 build/release/* --target e912acf76e86f65ed32b94a24a7ca824cfb8cc49 --prerelease --title "Blossom v0.2.9" --notes-file docs/releases/v0.2.9.md
