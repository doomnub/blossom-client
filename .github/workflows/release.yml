name: Publish existing 0.2.7.1 packages
on: create
permissions:
  contents: write
  actions: write
jobs:
  publish:
    if: github.event.ref_type == 'branch' && github.event.ref == 'publish-0.2.7.1'
    runs-on: ubuntu-latest
    steps:
      - name: Stop duplicate release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 40301474861 40301474435; do
            if [ "$(gh api repos/doomnub/blossom-client/actions/runs/$run --jq .head_sha)" = "1d7b95bbfb24824d0daa1f565f33f11d02201f64" ]; then
              gh api --method POST repos/doomnub/blossom-client/actions/runs/$run/cancel || true
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: 1d7b95bbfb24824d0daa1f565f33f11d02201f64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40301443244
          github-token: ${{ github.token }}
          pattern: blossom-native-*
          path: build/native-artifacts
      - uses: actions/download-artifact@v4
        with:
          run-id: 40301443192
          github-token: ${{ github.token }}
          name: blossom-client-ubuntu-latest
          path: build/libs
      - name: Assemble existing packages
        run: |
          python scripts/package_release.py
          python scripts/assemble_release.py
      - name: Publish hotfix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.7.1 >/dev/null 2>&1; then
            echo "Release already published."
          else
            gh release create v0.2.7.1 build/release/* --target 1d7b95bbfb24824d0daa1f565f33f11d02201f64 --prerelease --title "Blossom v0.2.7.1" --notes-file docs/releases/v0.2.7.1.md
          fi
