name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python scripts/package_release.py
      - name: Install and verify managed Java 8
        run: python scripts/test_runtime.py
      - name: Test Windows bootstrap without system Java
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          Expand-Archive "build/release/blossom-$version.zip" build/bootstrap-release
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/bootstrap-release/app/Start-Blossom.ps1 --install-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: blossom-client-${{ matrix.os }}
          path: build/libs/*.jar
