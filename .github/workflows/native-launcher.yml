name: Native launcher
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            launcher-tauri/core
            launcher-tauri/src-tauri
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: python scripts/build.py
      - run: cargo test --locked --manifest-path launcher-tauri/core/Cargo.toml
      - run: cargo run --locked --manifest-path launcher-tauri/core/Cargo.toml --example verify_install -- build/native-smoke
      - run: npm ci
        working-directory: launcher-tauri
      - run: npm run build
        working-directory: launcher-tauri
      - name: Browser UI checks and previews
        if: runner.os == 'Linux'
        working-directory: launcher-tauri
        run: |
          npx playwright install --with-deps chromium
          node scripts/ui-smoke.cjs
      - run: cargo build --locked --release --manifest-path launcher-tauri/src-tauri/Cargo.toml
      - run: python scripts/package_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blossom-native-${{ runner.os }}
          path: |
            build/native-release/*
            build/ui-check/*.png
