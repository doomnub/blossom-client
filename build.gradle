plugins { id 'base' }
group = 'dev.blossom'
version = file('VERSION').text.trim()
// Use the same pinned, checksum-verified compiler and relocation pipeline on every host.
// No Minecraft binaries are ever copied into the output jar.
tasks.register('compileAndVerify', Exec) {
    workingDir projectDir
    commandLine (System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'), 'scripts/build.py'
}
tasks.named('assemble') { dependsOn 'compileAndVerify' }
tasks.named('check') { dependsOn 'compileAndVerify' }
