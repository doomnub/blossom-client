  <g stroke="#211828" stroke-width="9" stroke-linejoin="round">
    <path d="M352 333 420 295 488 333 420 373Z" fill="#aedb9b"/>
    <path d="M352 333 420 373 420 457 352 416Z" fill="#93664e"/>
